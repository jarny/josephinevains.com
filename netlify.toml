# Netlify settings. The site is plain files, so there is no build step:
# Netlify publishes this folder as it is.
[build]
  publish = "."

# Let browsers keep fonts and images for a while; pages, CSS and JS are always rechecked.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
